[package]
name = "nft-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
siwe = "0.6"
rand = "0.8"
tower = "0.4"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "chrono", "bigdecimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
tracing-subscriber = "0.3"
alloy = { version = "2.2.0", features = ["full"] }
dotenvy = "0.15.7"
hex = "0.4.3"
